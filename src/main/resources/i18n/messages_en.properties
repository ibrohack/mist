help.game.title=A game's page
help.game.body=The game's images are at the top: click a thumbnail to see it large. Next to them are the description, the average rating, the release date, the studio and the tags.\n\nIn the buy box you add the game to your cart or your wishlist. If you already own it, you see "In your library".\n\nFurther down are the minimum requirements, the languages, the PEGI rating, the achievements and other players' reviews, by pages.

