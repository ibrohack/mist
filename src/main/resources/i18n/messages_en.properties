# Help (docs/ui-design.md, "Help"): one topic per screen, paragraphs separated by a blank line
menu.help=Help
help.title=MIST help
help.close=Close
help.shell.title=Getting started
help.shell.body=MIST is a PC game store. The header is always at the top: on the left, the sections your account type can use; on the right, your user menu.\n\nThe user menu opens your profile, changes the language (Spanish or English) and the theme (dark or light), and logs you out. Your language and theme are saved in your account.\n\nPress F1 on any screen to open this help on that screen's topic.
help.offline.title=Offline
help.offline.body=MIST could not reach its MongoDB database when it started.\n\nCheck that MongoDB is running (with Docker, MIST's container) and press Try again. If it keeps failing, check the connection string in mist.properties or in the MIST_MONGO_URI variable.
help.login.title=Logging in
help.login.body=Type your account's email and password and press Log in. If either is wrong you get the same message, so nobody can learn which accounts exist.\n\nES and EN switch the screen's language without losing the email you typed.\n\nNo account yet? Press Register.
help.register.title=Creating an account
help.register.body=Fill in your account and contact details. The password needs 8 to 128 characters, with at least one letter and one digit. The phone is optional, but if you give it, give both the code and the number.\n\nChoose the account type. As a player you give a nickname and the card you will pay with (only its brand and last four digits are stored). As a developer you give your studio's name and the IBAN your sales are paid into.\n\nFields in error are marked in red; hover over one to see why.
help.profile.title=Your profile
help.profile.body=Each row shows one item of your account. Press the pencil to edit it in the same row; Save applies the change and Cancel discards it. Only one row can be edited at a time.\n\nTo change the password, type the current one first. To change the card, type the new card's full number.\n\nChange photo uploads a PNG, JPEG or GIF image of up to 2 MB.\n\nDeactivating the account stops you from logging in again; for a developer, the published games leave the store.
help.admin-log.title=Operation log
help.admin-log.body=Each line is one database operation: the time, the user who did it, the operation, the collection, the details and whether it worked.\n\nPick the day in the calendar (only days with a log can be picked) and filter by user, by operation, or only the failed ones. Right-click a row to copy it or to filter by its user or operation.\n\nRefresh reads the log again without changing the day.

