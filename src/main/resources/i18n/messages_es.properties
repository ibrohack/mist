# Help (docs/ui-design.md, "Help"): one topic per screen, paragraphs separated by a blank line
menu.help=Ayuda
help.title=Ayuda de MIST
help.close=Cerrar
help.shell.title=Primeros pasos
help.shell.body=MIST es una tienda de juegos para PC. Arriba tienes siempre la cabecera: a la izquierda, las secciones que tu tipo de cuenta puede usar; a la derecha, tu menú de usuario.\n\nEl menú de usuario abre tu perfil, cambia el idioma (español o inglés) y el tema (oscuro o claro) y cierra la sesión. Tu idioma y tu tema se guardan en tu cuenta.\n\nPulsa F1 en cualquier pantalla para abrir esta ayuda en el tema de esa pantalla.
help.offline.title=Sin conexión
help.offline.body=MIST no ha podido llegar a su base de datos MongoDB al arrancar.\n\nComprueba que MongoDB está en marcha (en Docker, el contenedor de MIST) y pulsa Reintentar. Si sigue fallando, revisa la cadena de conexión en mist.properties o en la variable MIST_MONGO_URI.
help.login.title=Iniciar sesión
help.login.body=Escribe el correo y la contraseña de tu cuenta y pulsa Entrar. Si alguno no es correcto verás el mismo aviso, para no revelar qué cuentas existen.\n\nCon ES y EN cambias el idioma de la pantalla sin perder el correo escrito.\n\n¿No tienes cuenta? Pulsa Regístrate.
help.register.title=Crear una cuenta
help.register.body=Rellena tus datos de cuenta y de contacto. La contraseña necesita de 8 a 128 caracteres, con al menos una letra y un número. El teléfono es opcional, pero si lo indicas pon el prefijo y el número.\n\nElige el tipo de cuenta. Como jugador indicas un apodo y la tarjeta con la que pagarás (solo se guardan la marca y los cuatro últimos dígitos). Como desarrollador indicas el nombre de tu estudio y el IBAN donde cobrarás tus ventas.\n\nLos campos con errores se marcan en rojo; pasa el ratón por encima para ver el motivo.
help.profile.title=Tu perfil
help.profile.body=Cada fila muestra un dato de tu cuenta. Pulsa el lápiz para editarlo en la misma fila; Guardar aplica el cambio y Cancelar lo descarta. Solo puedes editar una fila a la vez.\n\nPara cambiar la contraseña escribe primero la actual. Para cambiar la tarjeta escribe el número completo de la nueva.\n\nCambiar foto sube una imagen PNG, JPEG o GIF de hasta 2 MB.\n\nDar de baja la cuenta impide volver a iniciar sesión; si eres desarrollador, tus juegos publicados se retiran de la tienda.
help.admin-log.title=Registro de operaciones
help.admin-log.body=Cada línea es una operación sobre la base de datos: la hora, el usuario que la hizo, la operación, la colección, los detalles y si funcionó.\n\nElige el día en el calendario (solo se pueden elegir días con registro) y filtra por usuario, por operación o solo las fallidas. Haz clic derecho en una fila para copiarla o filtrar por su usuario u operación.\n\nActualizar vuelve a leer el registro sin cambiar de día.

