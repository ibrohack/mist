help.game-editor.title=El editor de juegos
help.game-editor.body=Completa los detalles del juego: nombre, precio, fecha de lanzamiento, PEGI y descripción. Pulsa Guardar para guardar los cambios.\n\nCambiar portada y Añadir captura suben imágenes PNG, JPEG o GIF de hasta 2 MB. Haz clic derecho en una captura para quitarla.\n\nLos requisitos se indican todos o ninguno. Añade etiquetas una a una, marca los idiomas y edita los logros en la tabla con doble clic.\n\nPara publicar un borrador necesita portada, descripción, fecha de lanzamiento, PEGI y requisitos; lo que falte se marca en rojo.

