help.studio.body=Arriba ves tus ingresos, las unidades vendidas y cuántos juegos tienes a la venta, y debajo un gráfico con los ingresos de cada juego. Informe de ventas guarda estas cifras en un PDF.\n\nLa tabla lista todos tus juegos. Haz doble clic en un precio para cambiarlo y pulsa Intro para guardarlo; si el precio no es válido, vuelve el anterior. Editar (o doble clic en el nombre) abre el juego en el editor.\n\nNuevo juego crea un borrador y lo abre en el editor. Publica un borrador cuando tenga portada, descripción, fecha de lanzamiento, PEGI y requisitos; retira de la venta un juego publicado con Retirar.

