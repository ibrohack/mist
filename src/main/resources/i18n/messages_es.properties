help.store.body=Arriba tienes los juegos destacados: pasa de uno a otro con los números del carrusel. Debajo, las pestañas Novedades, Más vendidos y Gratis.\n\nEscribe en Buscar para encontrar juegos por su nombre; los resultados aparecen al dejar de escribir o al pulsar Intro. Borra el texto para volver a las pestañas.\n\nSi eres jugador, haz clic derecho en un juego para añadirlo al carrito o a tu lista de deseados. Como invitado puedes mirar, pero para comprar tienes que iniciar sesión.

