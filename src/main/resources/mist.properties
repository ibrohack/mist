# MIST settings. Environment variables (MIST_MONGO_URI, MIST_MONGO_DATABASE) override these values,
# and system properties (-Dmist.mongo.uri, -Dmist.mongo.database) override both.

# MongoDB runs as the single-node replica set rs0, which multi-document transactions need.
mist.mongo.uri=mongodb://localhost:27017/?replicaSet=rs0
mist.mongo.database=mist
