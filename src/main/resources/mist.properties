# MIST settings. Environment variables (MIST_MONGO_URI, MIST_MONGO_DATABASE, MIST_SEED_DEMO) override these values,
# and system properties (-Dmist.mongo.uri, -Dmist.mongo.database, -Dmist.seed.demo) override both.

# MongoDB runs as the single-node replica set rs0, which multi-document transactions need.
mist.mongo.uri=mongodb://localhost:27017/?replicaSet=rs0
mist.mongo.database=mist

# Fill an empty database with the demo accounts and catalog (see README, "Demo data"). Set to false to start empty.
mist.seed.demo=true
