name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install a virtual display for the JavaFX tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./mvnw -B verify
